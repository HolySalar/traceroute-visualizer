<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traceroute Visualizer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0b1220;--card:#141d33;--line:#24314f;--txt:#e6ecf7;--mut:#93a0b8;--acc:#22c55e;--warn:#f59e0b;--err:#f87171}
*{box-sizing:border-box}
body{font-family:Tahoma,Vazirmatn,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1d2b53 0%,var(--bg) 55%);color:var(--txt);margin:0;padding:24px;min-height:100vh}
.wrap{max-width:1020px;margin:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#22c55e,#0ea5e9);display:flex;align-items:center;justify-content:center;font-size:24px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.card{background:rgba(20,29,51,.92);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mut)}
input{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1428;color:var(--txt);font-size:15px;min-width:0}
#host{width:min(380px,100%)}
#hops{width:90px}
button{padding:11px 18px;border-radius:10px;border:none;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit}
.btn-go{background:linear-gradient(135deg,#22c55e,#16a34a);color:#04170c}
.btn-demo{background:#0ea5e9;color:#04121c}
button:disabled{opacity:.55;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:#0b1428;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-size:20px;display:block}
.stat span{font-size:12px;color:var(--mut)}
#msg{margin-top:10px;font-size:14px;min-height:22px}
.ok{color:var(--acc)} .warn{color:var(--warn)} .err{color:var(--err)}
.progress{height:6px;background:#0b1428;border-radius:99px;overflow:hidden;margin-top:10px;display:none}
.progress i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#0ea5e9);animation:slide 1.1s infinite linear}
@keyframes slide{from{margin-right:-40%}to{margin-right:100%}}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:right;vertical-align:top}
th{color:var(--mut);font-weight:normal;font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#0b1428;border:1px solid var(--line)}
.b-priv{color:var(--warn);border-color:#7c5a10}
.b-pub{color:var(--acc);border-color:#14532d}
.b-time{color:var(--err);border-color:#7f1d1d}
#map{height:440px;border-radius:14px;margin-top:12px;border:1px solid var(--line);background:#0b1428;z-index:0}
@media (max-width: 640px) { #host { width: 100% } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🌐</div>
    <div><h1>Traceroute Visualizer</h1><p>مسیر بسته‌ها تا مقصد + پینگ هر هاپ + موقعیت روی نقشه</p></div>
  </header>

  <div class="card">
    <div class="controls">
      <div class="field"><label>هاست یا IP مقصد</label><input id="host" placeholder="google.com یا 8.8.8.8" value="8.8.8.8" dir="ltr"></div>
      <div class="field"><label>حداکثر هاپ</label><input id="hops" type="number" value="20" min="1" max="64" dir="ltr"></div>
      <button id="btn" class="btn-go" onclick="runTrace()">🚀 Trace</button>
      <button id="demoBtn" class="btn-demo" onclick="runDemo()">🗺️ دمو</button>
    </div>
    <div class="progress" id="prog"><i></i></div>
    <div id="msg"></div>
    <div class="stats" id="stats" style="display:none">
      <div class="stat"><b id="sTotal">-</b><span>کل هاپ‌ها</span></div>
      <div class="stat"><b id="sGeo">-</b><span>هاپ روی نقشه</span></div>
      <div class="stat"><b id="sAvg">-</b><span>پینگ مقصد</span></div>
      <div class="stat"><b id="sCountry">-</b><span>کشور مقصد</span></div>
    </div>
    <div style="overflow-x:auto">
    <table id="tbl" style="display:none"><thead><tr><th>#</th><th>IP</th><th>پینگ</th><th>نوع</th><th>موقعیت / هاست</th><th>ISP</th></tr></thead><tbody></tbody></table>
    </div>
    <div id="map"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let map=null, layer=null;
function initMap(){
  if(typeof L==='undefined'){
    document.getElementById('map').innerHTML='<p style="padding:30px;text-align:center;color:#f87171">خطا در بارگذاری نقشه. اتصال اینترنت را بررسی و صفحه را رفرش کنید.</p>';
    return false;
  }
  if(map){map.invalidateSize();return true;}
  map = L.map('map',{worldCopyJump:true}).setView([32.5,53.6],3);
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OSM © CARTO'});
  carto.addTo(map);
  L.control.layers({"Carto":carto,"OpenStreetMap":osm}).addTo(map);
  layer = L.layerGroup().addTo(map);
  setTimeout(()=>map.invalidateSize(),300);
  return true;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(j){
  const tb=document.querySelector('#tbl tbody');tb.innerHTML='';
  document.getElementById('tbl').style.display='';
  layer.clearLayers();let pts=[],geoOk=0,geoFail=0;
  j.hops.forEach(h=>{
    const g=h.geo||{};
    const isTimeout=!h.ip;
    const isPriv=!!g.private;
    const loc=(g.city&&g.city!=='-'&&g.city!=='?')?`${g.city}, ${g.country||''}`:(h.hostname||'-');
    const badge=isTimeout?'<span class="badge b-time">timeout</span>':isPriv?'<span class="badge b-priv">LAN</span>':'<span class="badge b-pub">public</span>';
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${h.hop}</td><td dir="ltr">${esc(h.ip||'***')}</td><td dir="ltr">${h.avg_ms!=null?h.avg_ms+' ms':'—'}</td><td>${badge}</td><td>${esc(loc)}</td><td>${esc(g.isp||'')}</td>`;
    tb.appendChild(tr);
    if(g.lat!=null&&g.lon!=null){geoOk++;pts.push([g.lat,g.lon]);
      L.marker([g.lat,g.lon]).addTo(layer).bindPopup(`<b>#${h.hop}</b> ${esc(h.ip)}<br>${esc(loc)}<br>${h.avg_ms!=null?h.avg_ms+' ms':''}`);}
    else if(!isTimeout&&!isPriv){geoFail++;}
  });
  // stats
  const last=[...j.hops].reverse().find(h=>h.ip);
  document.getElementById('stats').style.display='';
  document.getElementById('sTotal').textContent=j.hops.length;
  document.getElementById('sGeo').textContent=geoOk;
  document.getElementById('sAvg').textContent=last&&last.avg_ms!=null?last.avg_ms+' ms':'—';
  const lg=last&&last.geo?last.geo:{};
  document.getElementById('sCountry').textContent=lg.country||'—';
  // map draw
  if(pts.length>1){const line=L.polyline(pts,{color:'#ef4444',weight:3}).addTo(layer);map.flyToBounds(line.getBounds(),{duration:1});}
  else if(pts.length===1){map.flyTo(pts[0],6,{duration:1});}
  setTimeout(()=>map.invalidateSize(),400);
  return {geoOk,geoFail};
}
async function runTrace(){
  if(!initMap())return;
  const host=document.getElementById('host').value.trim();
  const max_hops=Math.min(Math.max(parseInt(document.getElementById('hops').value||'20'),1),64);
  const btn=document.getElementById('btn'),msg=document.getElementById('msg'),prog=document.getElementById('prog');
  if(!host){msg.innerHTML='<span class=err>هاست را وارد کن.</span>';return;}
  btn.disabled=true;prog.style.display='block';
  msg.innerHTML='⏳ در حال trace... لطفاً صبر کنید';
  try{
    const r=await fetch('/api/trace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host,max_hops})});
    const j=await r.json();
    if(!j.ok){msg.innerHTML='<span class=err>خطا: '+esc(j.error)+'</span>';return;}
    const {geoOk,geoFail}=render(j);
    let extra=` — <span class=ok>${geoOk} هاپ روی نقشه</span>`;
    if(geoFail>0)extra+=` — <span class=warn>${geoFail} هاپ geolocate نشد</span>`;
    if(geoOk===0)extra+='<br><span class=warn>نقطه‌ای برای نمایش روی نقشه نیست.</span>';
    msg.innerHTML=`✅ Target: <b dir="ltr">${esc(j.target)} (${esc(j.resolved)})</b> — ${j.hops.length} hops`+extra;
  }catch(e){msg.innerHTML='<span class=err>خطای اتصال: '+esc(e)+'</span>';}
  finally{btn.disabled=false;prog.style.display='none';}
}
async function runDemo(){
  if(!initMap())return;
  const msg=document.getElementById('msg');
  msg.innerHTML='⏳ لود دمو...';
  try{
    const r=await fetch('/api/demo');const j=await r.json();
    if(!j.ok){msg.innerHTML='<span class=err>دمو لود نشد</span>';return;}
    render(j);
    msg.innerHTML='✅ حالت <b>دمو</b> — مسیر نمونه روی نقشه نمایش داده شد.';
  }catch(e){msg.innerHTML='<span class=err>خطا: '+esc(e)+'</span>';}
}
window.addEventListener('load',()=>{initMap();});
</script>
</body>
</html>
